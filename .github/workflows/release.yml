name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.3.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      # Build provenance attestations.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content src/Anode/Anode.csproj
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag must match the project version.' }
          git show-ref --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release requires an existing tag.' }
      - name: Publish and test
        run: ./scripts/build.ps1 -QuickTest -Package -Mcpb
      - name: Generate installable registry entry and bundle checksum
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/registry-entry.ps1 -Tag $env:RELEASE_TAG -Bundle artifacts/release/anode-windows-x64.mcpb
          $hash = (Get-FileHash -LiteralPath artifacts/release/anode-windows-x64.mcpb -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'artifacts/release/anode-windows-x64.mcpb.sha256'), "$hash  anode-windows-x64.mcpb`n", [Text.Encoding]::ASCII)
      - name: Test installation and configuration
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-install.ps1
      - name: Check distribution
        run: ./scripts/test-distribution.ps1 -Release
      # Verify a download with: gh attestation verify anode-windows-x64.zip --repo skulitom/Anode
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/release/anode-windows-x64.zip
            artifacts/release/install.ps1
            artifacts/release/anode-windows-x64.mcpb
      - name: Upload MCPB for owner testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anode-windows-x64-mcpb
          path: |
            artifacts/release/anode-windows-x64.mcpb
            artifacts/release/anode-windows-x64.mcpb.sha256
            artifacts/release/server.registry.json
          if-no-files-found: error
      # The bundle and registry entry go to the anode-windows-x64-mcpb workflow artifact.
      # Only the owner uploads the bundle after the Claude Desktop test; see docs/PUBLISHING.md.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Only the highest stable version becomes Latest, so a backport never moves installers back.
          $highest = git tag --list 'v*' | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              Sort-Object { [version]$_.Substring(1) } | Select-Object -Last 1
          $latest = ($env:RELEASE_TAG -ceq $highest).ToString().ToLowerInvariant()
          gh release create $env:RELEASE_TAG artifacts/release/anode-windows-x64.zip artifacts/release/install.ps1 artifacts/release/SHA256SUMS --verify-tag --title "Anode $env:RELEASE_TAG" --notes-file .github/RELEASE_NOTES.md "--latest=$latest"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
