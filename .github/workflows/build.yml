name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Anode.sln

      - name: Build
        run: dotnet build Anode.sln -c Release --no-restore --nologo

      - name: Publish
        run: ./scripts/build.ps1 -Package -Mcpb

      # The quick self-test covers only environment-independent behavior: key-name
      # resolution, gamepad name mapping, pipe deadlines/cancellation, MCP stdio,
      # launch quoting, session identity, desktop reference/worker limits, report
      # escaping and readable child-session APIs. Live accessibility uses the
      # opt-in scripts/test-desktop.ps1 fixture inside an existing seat.
      # Screen capture, the Task Scheduler hand-off and
      # the ViGEm gamepad need a real interactive desktop and a driver, so they are left
      # to `anode selftest` on a developer machine.
      - name: Self-test
        run: |
          ./dist/anode.exe version | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/anode.exe selftest --quick | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report machine readiness
        continue-on-error: true
        run: |
          ./dist/anode.exe doctor | Out-Host
          exit $LASTEXITCODE

      - name: Test installation and configuration
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-install.ps1

      # Versions, checksums, archive entries and payload, the MCPB bundle and any distribution
      # manifests. Runs only `anode version` and `anode mcp` (initialize and tools/list).
      - name: Check distribution
        run: ./scripts/test-distribution.ps1

      - name: Check documentation
        run: ./scripts/check-docs.ps1 -Anode dist/anode.exe

      # The .mcpb is for manual Claude Desktop testing only; release.yml does not publish it yet.
      - uses: actions/upload-artifact@v4
        with:
          name: anode-windows-x64
          path: |
            artifacts/release/anode-windows-x64.zip
            artifacts/release/install.ps1
            artifacts/release/SHA256SUMS
            artifacts/release/anode-windows-x64.mcpb
          if-no-files-found: error
