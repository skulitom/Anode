name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Anode.sln

      - name: Build
        run: dotnet build Anode.sln -c Release --no-restore --nologo

      - name: Publish
        run: >
          dotnet publish src/Anode/Anode.csproj
          -c Release -r win-x64 --self-contained true
          -o dist --no-restore --nologo

      # The quick self-test covers only environment-independent behaviour: key-name
      # resolution, gamepad name mapping, the named-pipe round trip and that the
      # child-session APIs are readable. Screen capture, the Task Scheduler hand-off and
      # the ViGEm gamepad need a real interactive desktop and a driver, so they are left
      # to `anode selftest` on a developer machine.
      - name: Self-test
        run: |
          ./dist/anode.exe version
          ./dist/anode.exe selftest --quick

      - name: Report machine readiness
        continue-on-error: true
        run: ./dist/anode.exe doctor

      - uses: actions/upload-artifact@v4
        with:
          name: anode-windows-x64
          path: |
            dist/anode.exe
            dist/README.md
            dist/LICENSE.txt
          if-no-files-found: error
