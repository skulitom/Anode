name: Bug report
description: Report an installation, configuration or runtime problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Check [troubleshooting](https://github.com/skulitom/Anode/blob/main/docs/TROUBLESHOOTING.md) first. Remove private information from logs and screenshots."
  - type: input
    id: version
    attributes:
      label: Anode version
      description: Output of `anode version`
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows edition and build
      placeholder: Windows 11 Pro, build ...
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options: [PowerShell installer, Portable release ZIP, Built from source]
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Agent client
      options: [Claude Code, Codex CLI, Claude Desktop, Other MCP client, CLI only]
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: What you ran or asked the agent, what you expected, and what happened.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: 'Paste the output of `anode doctor`, `anode status --json` and `anode capabilities --json`, plus relevant lines from the log. `status --json` reports its `logPath`, usually %LOCALAPPDATA%\Anode\anode.log. Remove personal information.'
      render: text
